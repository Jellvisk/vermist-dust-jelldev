- type: entity
  id: PulverisBarrier
  parent: BaseStructure
  name: pulveris barrier
  description: You can't quite make out what's inside, and you can never seem to properly touch it.
  placement:
    mode: SnapgridCenter
  components:
  # - type: Transform
  #   noRot: false
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    layers:
    - sprite: _VDS/Structures/Machines/PulverisBarrier/barrier.rsi
      state: barrier
  - type: AnimationPlayer
  - type: SyncSprite
  - type: Appearance
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - DoorPassable
        density: 0
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3
  - type: BlockWeather
  - type: Battery
    netsync: false
    maxCharge: 1000
    startingCharge: 1000
  - type: PowerNetworkBattery
    maxChargeRate: 100
  - type: PowerCell
  - type: PowerCellDraw
    drawRate: 10
  - type: PulverisBarrier
  - type: NodeContainer
    examinable: true
    nodes:
      barrier:
        !type:DirectionalNode
        nodeGroupID: PulverisBarrier
        openDirections:
          - North
          - South
  - type: LightningTarget
    priority: 1
  - type: Reflect
    reflects:
    - Energy
    - NonEnergy
    - Meteor
  # triggers
  - type: ChargedReflect
  - type: TriggerOnHurt
    keyOut: hit
  - type: TriggerOnCollide
    ignoreOtherNonHard: false
    fixtureID: fix1
    keyOut: hit
  - type: AdjustBatteryChargeOnTrigger
    powerAdjustment: -100
    damagePowerScalar: -0.9
    keysIn:
    - hit
  # - type: TriggerOnPowerChanged
  #   keyOut: power
  # # while triggered:
  # - type: ToggleComponentsOnTrigger
  #   keysIn:
  #   - power
  #   components:



- type: entity
  id: PulverisBarrierController
  parent: [ BaseMachine ]
  name: pulveris barrier controller
  description: A hefty machine capable of revealing an ultra-pressurized tear in reality.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    layers:
    - sprite: _VDS/Structures/Machines/PulverisBarrier/machine.rsi
      state: machine
  - type: Rotatable
  - type: Anchorable
  - type: PulverisBarrierController
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
      barrier:
        !type:DirectionalNode
        nodeGroupID: PulverisBarrier
        openDirections:
          - North
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: Battery
    netsync: false
    maxCharge: 1000
    startingCharge: 0
  - type: BatteryCharger
    voltage: Medium
  - type: PowerNetworkBattery
    maxChargeRate: 100
  - type: ExaminableBattery
  - type: Lock
    locked: true
  # - type: LockVisuals
  - type: LockedAnchorable
  - type: LockedWiresPanel
  - type: AccessReader
    access: [[ "Engineering" ]]
  - type: WirelessNetworkConnection
    range: 200
