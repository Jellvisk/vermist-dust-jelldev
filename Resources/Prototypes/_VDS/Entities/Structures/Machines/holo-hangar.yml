- type: entity
  id: HoloHangar
  parent: BaseMachine
  name: holo hangar
  description: badass
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    sprite: _VDS/Structures/Machines/holo_hangar.rsi
    state: dirtest
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.5,0.48,-0.28"
        mask:
        - FullTileMask
        layer:
        - SpecialWallLayer
        density: 1000
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Climbable
  - type: Reflect
    reflectProb: 1
  - type: Anchorable
    flags:
    - Anchorable
