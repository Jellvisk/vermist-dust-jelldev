- type: entity
  id: HoloBarrier
  parent: [ BaseMachine ]
  name: holo barrier
  description: badass
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    sprite: _VDS/Structures/Machines/holo_barrier.rsi
    layers:
    - state: base
    - state: holo_barrier_wall
    - state: holo_barrier_top
      offset: "0.59,0"
  - type: AnimationPlayer
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.5,0.48,-0.30"
        layer:
        - DoorPassable
        density: 500
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Battery
    netsync: false
    maxCharge: 1000
    startingCharge: 0
  - type: BatteryCharger
    voltage: Medium
  - type: PowerNetworkBattery
    maxChargeRate: 100
  # - type: PowerCell
  # - type: PowerCellDraw
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: ExaminableBattery
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: Lock
    locked: true
  # - type: LockVisuals
  - type: LockedAnchorable
  - type: LockedWiresPanel
  - type: AccessReader
    access: [[ "Engineering" ]]
  - type: WirelessNetworkConnection
    range: 200
  - type: LightningTarget
    priority: 1
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: PowerCellDraw
    drawRate: 50
  # triggers
  - type: IsPoweredTriggerCondition
    keys:
    - hit
  - type: TriggerOnHurt
    keyOut: hit
  - type: TriggerOnCollide
    ignoreOtherNonHard: false
    fixtureID: holo
    keyOut: hit
  - type: AdjustBatteryChargeOnTrigger
    powerAdjustment: -100
    damagePowerScalar: -0.9
    keysIn:
    - hit
  - type: TriggerOnPowerChanged
    keyOut: power
  # while triggered:
  - type: ToggleComponentsOnTrigger
    keysIn:
    - power
    components:
    - type: Reflect
      reflects:
      - Energy
      - NonEnergy
      - Meteor
    - type: ChargedReflect
    - type: FixturesChange
      fixtures:
        holo:
          shape:
            !type:PhysShapeAabb
              bounds: "-0.48,-0.5,0.48,-0.28"
          layer:
          - SpecialWallLayer
          hard: true
          density: 1000
    - type: Airtight
      noAirWhenFullyAirBlocked: false
      airBlockedDirection:
        - South
    - type: Climbable
    - type: BlockWeather
