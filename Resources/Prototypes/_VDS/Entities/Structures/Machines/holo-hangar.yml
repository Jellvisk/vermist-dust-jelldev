- type: entity
  id: PulverisBarrier
  parent: BaseStructure
  name: pulveris barrier
  description: You can't quite make out what's inside, and you can never seem to properly touch it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
    - sprite: _VDS/Structures/Machines/PulverisBarrier/barrier.rsi
      state: barrier
      shader: unshaded
  - type: Transform
    anchored: true
    noRot: false
  - type: AnimationPlayer
  - type: SyncSprite
  - type: Appearance
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - DoorPassable
        mask:
        - FullTileMask
        density: 0
        hard: true
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.2
    sprintSpeedModifier: 0.2
  - type: BlockWeather
  - type: Battery
    netsync: false
    maxCharge: 1000
    startingCharge: 1000
  - type: PowerNetworkBattery
    maxChargeRate: 100
  - type: PowerCell
  - type: PowerCellDraw
    drawRate: 10
  - type: PulverisBarrier
  - type: NodeContainer
    examinable: true
    nodes:
      barrier:
        !type:DirectionalNode
        nodeGroupID: PulverisBarrier
        openDirections:
          - North
          - South
  - type: LightningTarget
    priority: 1
  - type: Reflect
    reflects:
    - Energy
    - NonEnergy
    - Meteor
  - type: ChargedReflect
  # triggers
  # hit trigger:
  - type: TriggerOnHurt
    keyOut: hit
  - type: TriggerOnCollide
    ignoreOtherNonHard: false
    fixtureID: fix1
    keyOut: hit
  - type: AdjustBatteryChargeOnTrigger
    powerAdjustment: -100
    damagePowerScalar: -0.9
    keysIn:
    - hit
  # power delete trigger:
  - type: TriggerOnUnpowered
    keyOut: power
  - type: DeleteOnTrigger
    keysIn:
    - power



- type: entity
  id: PulverisBarrierController
  parent: [ BaseMachine ]
  name: pulveris barrier controller
  description: A hefty machine capable of revealing an ultra-pressurized tear in reality.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _VDS/Structures/Machines/PulverisBarrier/controller.rsi
    layers:
      - state: controller
      - state: connected
        map: ["connectedLayer"]
        visible: false
        shader: unshaded
      - map: ["connectedActivateLayer"]
        visible: false
        shader: unshaded
        loop: false
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.PulverisBarrierRelayVisuals.ConnectionVisualState:
        connectedLayer:
          None: {visible: false}
          North: {visible: true}
      enum.PulverisBarrierRelayVisuals.ConnectionVisualActivatingState:
        connectedActivateLayer:
          None: {visible: false}
          North: {visible: true, state: connected_activate, loop: false}
  - type: Rotatable
  - type: Anchorable
  - type: PulverisBarrierController
  - type: PulverisBarrierRelay
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
      barrier:
        !type:DirectionalNode
        nodeGroupID: PulverisBarrier
        openDirections:
          - North
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: Battery
    netsync: false
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryCharger
    voltage: Medium
  - type: PowerNetworkBattery
    maxChargeRate: 100
  - type: ExaminableBattery
  - type: PowerCell
  - type: PowerCellDraw
    drawRate: 10
  - type: Lock
    locked: true
  # - type: LockVisuals
  - type: LockedAnchorable
  - type: LockedWiresPanel
  - type: AccessReader
    access: [[ "Engineering" ]]
  - type: WirelessNetworkConnection
    range: 200
  - type: ActivatableUI
    key: enum.PulverisBarrierControllerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
        enum.PulverisBarrierControllerUiKey.Key:
          type: PulverisBarrierControllerBoundUserInterface

